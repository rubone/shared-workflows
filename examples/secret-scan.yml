# Call mode: copy to .github/workflows/secret-scan.yml in the project repo.
# For other organizations, copy .github/workflows/secret-scan.yml instead (copy mode).
# Docs: https://github.com/rubone/shared-workflows/blob/main/docs/secret-scan.md
name: Secret scan

on:
  pull_request:
    branches:
      - main   # change if the repo's default branch isn't main
  push:
    branches:
      - main
  workflow_dispatch:   # manual run: scans the whole history (see full_history below)

permissions: {}

jobs:
  secret-scan:
    # The reusable workflow's jobs can't get more permissions than the caller grants.
    permissions:
      contents: read
    uses: rubone/shared-workflows/.github/workflows/secret-scan.yml@v1
    with:
      full_history: ${{ github.event_name == 'workflow_dispatch' }}
      warn_only: false   # true = report only, never fail
