# Call mode: copy to .github/workflows/android-ci.yml in the project repo.
# To not depend on this repo (or if the org blocks external workflows), copy .github/workflows/android-ci.yml instead (copy mode).
# Docs: https://github.com/rubone/shared-workflows/blob/main/docs/android-ci.md
name: Android CI

on:
  pull_request:
    branches:
      - main   # change if the repo's default branch isn't main
  push:
    branches:
      - main

permissions: {}

jobs:
  android-ci:
    # The reusable workflow's jobs can't get more permissions than the caller grants.
    # contents: write is used only by the dependency graph job, on pushes to main; the
    # build job itself runs with contents: read.
    permissions:
      contents: write
    uses: rubone/shared-workflows/.github/workflows/android-ci.yml@v1
    with:
      working_directory: '.'            # folder with gradlew
      java_version: '21'
      variant: 'debug'                  # with flavors, e.g. 'devDebug'
      steps: 'lint,test,assemble'
      apk_retention_days: 7
      submit_dependencies: 'true'       # 'false' if the dependency graph is off
