# Validates changes to this repo on every PR: lints every workflow and calls each
# reusable workflow from the current branch (call mode). Not meant to be copied.
name: Self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Smoke test of call mode: calls the workflow from the current branch. No secret is
  # passed, so it exercises the workflow_call wiring and exits with a warning instead
  # of posting to Slack. (Copy mode is exercised too: pr_slack_notify.yml's own
  # pull_request trigger also runs on PRs to main in this repo.)
  pr-slack-notify:
    name: PR Slack notification (smoke test)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_slack_notify.yml
    with:
      jira_base_url: 'https://example.atlassian.net'
      slack_mention_ids: 'U01ABCDEFG'

  # Smoke test of call mode. The nested job needs pull-requests: write (PR comment),
  # so the calling job must grant it. warn_only keeps it from blocking PRs here.
  # On a repo without dependency review support, `detect` skips it with a warning.
  dependency-review:
    name: Dependency review (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dependency-review.yml
    with:
      fail_on_severity: 'high'
      comment_summary: 'never'
      warn_only: true

  # Smoke test of call mode on this repo's own PR commits. warn_only keeps a finding
  # from blocking PRs here; the job summary still lists it.
  secret-scan:
    name: Secret scan (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml
    with:
      warn_only: true

  # Smoke test of call mode (here it analyzes only `actions`). On a repo without code
  # scanning support, `detect` skips the analysis with a warning.
  codeql:
    name: CodeQL (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  # Smoke test of call mode: checks this PR's title and labels it by size and paths.
  pr-checks:
    name: PR checks (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pr-checks.yml

  # Smoke test of call mode as a dry run: logs what it would mark or close in this repo,
  # without changing anything.
  stale:
    name: Stale (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/stale.yml
    with:
      dry_run: true

  # Smoke test of call mode on the fixtures in tests/fixtures (one per package manager,
  # no dependencies), plus the repo root, which has no package.json and must skip with
  # a warning.
  node-ci:
    name: Node CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/node-npm          # .nvmrc, all four scripts
          - tests/fixtures/node-pnpm         # packageManager, test:ci over test, no typecheck
          - tests/fixtures/node-yarn         # Yarn 1, engines.node, npm init's test placeholder
          - tests/fixtures/node-yarn-berry   # Yarn 4 through Corepack, type-check script
          - .                                # no package.json: skipped with a warning
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working_directory: ${{ matrix.project }}

  # Smoke test of call mode on tests/fixtures/dotnet (.slnx, global.json, .editorconfig,
  # xUnit), with warnings as errors; plus the repo root, which has no solution and must
  # skip with a warning.
  dotnet-ci:
    name: .NET CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/dotnet
          - .
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      warnings_as_errors: true

  # Smoke test of call mode on tests/fixtures/android (Kotlin DSL, version catalog, AGP 9,
  # JUnit), plus the repo root, which has no gradlew and must skip with a warning. The
  # nested dependency-graph job asks for contents: write, so the caller must grant it; it
  # never runs on PRs. Also runs on manual runs: `gh workflow run _self-test.yml --ref main`
  # tests the dependency submission and saves the Gradle cache that PRs then restore.
  android-ci:
    name: Android CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/android
          - .
    permissions:
      contents: write
    uses: ./.github/workflows/android-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      apk_retention_days: 1

  # Smoke test of call mode on tests/fixtures/flutter (Flutter pinned with .fvmrc, Android
  # host app in Java so CodeQL doesn't need a Kotlin build), with both build targets, plus
  # the repo root, which has no pubspec.yaml and must skip with a warning. Also runs on
  # manual runs on main, which save the Flutter SDK, pub and Gradle caches that PRs restore.
  flutter-ci:
    name: Flutter CI (smoke test, ${{ matrix.project }}, ${{ matrix.build_target }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: tests/fixtures/flutter, build_target: apk }
          - { project: tests/fixtures/flutter, build_target: web }
          - { project: ., build_target: apk }
    permissions:
      contents: read
    uses: ./.github/workflows/flutter-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      build_target: ${{ matrix.build_target }}
      artifact_retention_days: 1

  # Smoke test of call mode on tests/fixtures/laravel (Laravel 13 skeleton, PHPUnit, Pint,
  # Larastan, Vite): every step on SQLite, and the tests on each database server; plus the
  # repo root, which has no composer.json and must skip with a warning.
  php-laravel-ci:
    name: Laravel CI (smoke test, ${{ matrix.project }}, ${{ matrix.db }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: tests/fixtures/laravel, db: sqlite, steps: 'format,analyze,assets,test' }
          - { project: tests/fixtures/laravel, db: mysql, steps: test }
          - { project: tests/fixtures/laravel, db: mariadb, steps: test }
          - { project: tests/fixtures/laravel, db: pgsql, steps: test }
          - { project: ., db: sqlite, steps: test }
    permissions:
      contents: read
    uses: ./.github/workflows/php-laravel-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      db_connection: ${{ matrix.db }}
      steps: ${{ matrix.steps }}

  # Smoke test of call mode on tests/fixtures/docker, for amd64 and arm64 (native ARM runner,
  # since this repo is public), plus the repo root, which has no Dockerfile and must skip
  # with a warning. PRs only build; nothing is pushed. The nested jobs ask for packages and
  # id-token write, so the caller must grant them.
  docker-build-push:
    name: Docker (smoke test, ${{ matrix.context }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        context:
          - tests/fixtures/docker
          - .
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      context: ${{ matrix.context }}
      image_name: shared-workflows-fixture
      platforms: linux/amd64,linux/arm64
      build_args: |
        GREETING=Hello from the self-test

  # Smoke test of call mode on PRs: builds tests/fixtures/docker (with docker-build-push's
  # layer cache), scans it and uploads the results to this repo's code scanning; plus the
  # repo root, which has no Dockerfile and must skip with a warning.
  trivy-scan:
    name: Trivy (smoke test, ${{ matrix.context }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        context:
          - tests/fixtures/docker
          - .
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/trivy-scan.yml
    with:
      context: ${{ matrix.context }}
      image_name: shared-workflows-fixture
      build_args: |
        GREETING=Hello from the self-test

  # Scans an old Alpine (pinned by digest) with known, fixed CRITICAL and HIGH
  # vulnerabilities, in report-only mode and without uploading them to this repo's
  # Security tab. The next job checks that they were found and didn't fail the run.
  trivy-scan-vulnerable:
    name: Trivy (smoke test, vulnerable image)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image: alpine:3.18.0@sha256:02bb6f428431fbc2809c5d1b41eab5a68350194fb508869a33cb1af4444c9b11
      fail_on: none
      upload_sarif: 'off'

  trivy-scan-outputs:
    name: Trivy (smoke test, check outputs)
    needs: trivy-scan-vulnerable
    runs-on: ubuntu-latest
    steps:
      - name: Check the scan's outputs
        env:
          CRITICAL: ${{ needs.trivy-scan-vulnerable.outputs.critical }}
          HIGH: ${{ needs.trivy-scan-vulnerable.outputs.high }}
          BLOCKING: ${{ needs.trivy-scan-vulnerable.outputs.blocking }}
        run: |
          echo "critical=${CRITICAL} high=${HIGH} blocking=${BLOCKING}"
          if [ "${CRITICAL:-0}" -eq 0 ] || [ "${HIGH:-0}" -eq 0 ] || [ "${BLOCKING}" != 0 ]; then
            echo "::error::Expected CRITICAL and HIGH findings and nothing blocking (fail_on: none)."
            exit 1
          fi
