# Validates changes to this repo on every PR. Not reusable: it is the only workflow
# here that runs on its own.
name: Self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Smoke test of call mode: calls the workflow from the current branch. No secret is
  # passed, so it exercises the workflow_call wiring and exits with a warning instead
  # of posting to Slack. (Copy mode is exercised too: pr_slack_notify.yml's own
  # pull_request trigger also runs on PRs to main in this repo.)
  pr-slack-notify:
    name: PR Slack notification (smoke test)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_slack_notify.yml
    with:
      jira_base_url: 'https://example.atlassian.net'
      slack_mention_ids: 'U01ABCDEFG'
