# Validates changes to this repo on every PR: lints every workflow and calls each
# reusable workflow from the current branch (call mode). Not meant to be copied.
name: Self-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Smoke test of call mode: calls the workflow from the current branch. No secret is
  # passed, so it exercises the workflow_call wiring and exits with a warning instead
  # of posting to Slack. (Copy mode is exercised too: pr_slack_notify.yml's own
  # pull_request trigger also runs on PRs to main in this repo.)
  pr-slack-notify:
    name: PR Slack notification (smoke test)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_slack_notify.yml
    with:
      jira_base_url: 'https://example.atlassian.net'
      slack_mention_ids: 'U01ABCDEFG'

  # Smoke test of call mode. The nested job needs pull-requests: write (PR comment),
  # so the calling job must grant it. warn_only keeps it from blocking PRs here.
  # On a repo without dependency review support, `detect` skips it with a warning.
  dependency-review:
    name: Dependency review (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dependency-review.yml
    with:
      fail_on_severity: 'high'
      comment_summary: 'never'
      warn_only: true

  # Smoke test of call mode on this repo's own PR commits. warn_only keeps a finding
  # from blocking PRs here; the job summary still lists it.
  secret-scan:
    name: Secret scan (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml
    with:
      warn_only: true

  # Smoke test of call mode (here it analyzes only `actions`). On a repo without code
  # scanning support, `detect` skips the analysis with a warning.
  codeql:
    name: CodeQL (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  # Smoke test of call mode: checks this PR's title and labels it by size and paths.
  pr-checks:
    name: PR checks (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pr-checks.yml

  # Smoke test of call mode as a dry run: logs what it would mark or close in this repo,
  # without changing anything.
  stale:
    name: Stale (smoke test)
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/stale.yml
    with:
      dry_run: true

  # Smoke test of call mode on the fixtures in tests/fixtures (one per package manager,
  # no dependencies), plus the repo root, which has no package.json and must skip with
  # a warning.
  node-ci:
    name: Node CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/node-npm          # .nvmrc, all four scripts
          - tests/fixtures/node-pnpm         # packageManager, test:ci over test, no typecheck
          - tests/fixtures/node-yarn         # Yarn 1, engines.node, npm init's test placeholder
          - tests/fixtures/node-yarn-berry   # Yarn 4 through Corepack, type-check script
          - .                                # no package.json: skipped with a warning
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working_directory: ${{ matrix.project }}

  # Smoke test of call mode on tests/fixtures/dotnet (.slnx, global.json, .editorconfig,
  # xUnit), with warnings as errors; plus the repo root, which has no solution and must
  # skip with a warning.
  dotnet-ci:
    name: .NET CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/dotnet
          - .
    permissions:
      contents: read
    uses: ./.github/workflows/dotnet-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      warnings_as_errors: true

  # Smoke test of call mode on tests/fixtures/android (Kotlin DSL, version catalog, AGP 9,
  # JUnit), plus the repo root, which has no gradlew and must skip with a warning. The
  # nested dependency-graph job asks for contents: write, so the caller must grant it; it
  # never runs on PRs. Also runs on manual runs: `gh workflow run _self-test.yml --ref main`
  # tests the dependency submission and saves the Gradle cache that PRs then restore.
  android-ci:
    name: Android CI (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/android
          - .
    permissions:
      contents: write
    uses: ./.github/workflows/android-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      apk_retention_days: 1

  # Smoke test of call mode on tests/fixtures/flutter (Flutter pinned with .fvmrc, Android
  # host app in Java so CodeQL doesn't need a Kotlin build), with both build targets, plus
  # the repo root, which has no pubspec.yaml and must skip with a warning. Also runs on
  # manual runs on main, which save the Flutter SDK, pub and Gradle caches that PRs restore.
  flutter-ci:
    name: Flutter CI (smoke test, ${{ matrix.project }}, ${{ matrix.build_target }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: tests/fixtures/flutter, build_target: apk }
          - { project: tests/fixtures/flutter, build_target: web }
          - { project: ., build_target: apk }
    permissions:
      contents: read
    uses: ./.github/workflows/flutter-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      build_target: ${{ matrix.build_target }}
      artifact_retention_days: 1

  # Smoke test of call mode on tests/fixtures/laravel (Laravel 13 skeleton, PHPUnit, Pint,
  # Larastan, Vite): every step on SQLite, and the tests on each database server; plus the
  # repo root, which has no composer.json and must skip with a warning.
  php-laravel-ci:
    name: Laravel CI (smoke test, ${{ matrix.project }}, ${{ matrix.db }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: tests/fixtures/laravel, db: sqlite, steps: 'format,analyze,assets,test' }
          - { project: tests/fixtures/laravel, db: mysql, steps: test }
          - { project: tests/fixtures/laravel, db: mariadb, steps: test }
          - { project: tests/fixtures/laravel, db: pgsql, steps: test }
          - { project: ., db: sqlite, steps: test }
    permissions:
      contents: read
    uses: ./.github/workflows/php-laravel-ci.yml
    with:
      working_directory: ${{ matrix.project }}
      db_connection: ${{ matrix.db }}
      steps: ${{ matrix.steps }}

  # Smoke test of call mode on tests/fixtures/docker, for amd64 and arm64 (native ARM runner,
  # since this repo is public), plus the repo root, which has no Dockerfile and must skip
  # with a warning. PRs only build; nothing is pushed. The nested jobs ask for packages and
  # id-token write, so the caller must grant them.
  docker-build-push:
    name: Docker (smoke test, ${{ matrix.context }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        context:
          - tests/fixtures/docker
          - .
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      context: ${{ matrix.context }}
      image_name: shared-workflows-fixture
      platforms: linux/amd64,linux/arm64
      build_args: |
        GREETING=Hello from the self-test

  # Smoke test of call mode on PRs: builds tests/fixtures/docker (with docker-build-push's
  # layer cache), scans it and uploads the results to this repo's code scanning; plus the
  # repo root, which has no Dockerfile and must skip with a warning.
  trivy-scan:
    name: Trivy (smoke test, ${{ matrix.context }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        context:
          - tests/fixtures/docker
          - .
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/trivy-scan.yml
    with:
      context: ${{ matrix.context }}
      image_name: shared-workflows-fixture
      build_args: |
        GREETING=Hello from the self-test

  # Scans an old Alpine (pinned by digest) with known, fixed CRITICAL and HIGH
  # vulnerabilities, in report-only mode and without uploading them to this repo's
  # Security tab. The next job checks that they were found and didn't fail the run.
  trivy-scan-vulnerable:
    name: Trivy (smoke test, vulnerable image)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image: alpine:3.18.0@sha256:02bb6f428431fbc2809c5d1b41eab5a68350194fb508869a33cb1af4444c9b11
      fail_on: none
      upload_sarif: 'off'

  trivy-scan-outputs:
    name: Trivy (smoke test, check outputs)
    needs: trivy-scan-vulnerable
    runs-on: ubuntu-latest
    steps:
      - name: Check the scan's outputs
        env:
          CRITICAL: ${{ needs.trivy-scan-vulnerable.outputs.critical }}
          HIGH: ${{ needs.trivy-scan-vulnerable.outputs.high }}
          BLOCKING: ${{ needs.trivy-scan-vulnerable.outputs.blocking }}
        run: |
          echo "critical=${CRITICAL} high=${HIGH} blocking=${BLOCKING}"
          if [ "${CRITICAL:-0}" -eq 0 ] || [ "${HIGH:-0}" -eq 0 ] || [ "${BLOCKING}" != 0 ]; then
            echo "::error::Expected CRITICAL and HIGH findings and nothing blocking (fail_on: none)."
            exit 1
          fi

  # Smoke test of call mode on tests/fixtures/static-web (npm, .nvmrc, a
  # staticwebapp.config.json outside the build output), plus the repo root, which has no
  # package.json and must skip with a warning. PRs only build: the deploy job is skipped.
  azure-static-web-apps-deploy:
    name: Static Web App (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/static-web
          - .
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/azure-static-web-apps-deploy.yml
    with:
      working_directory: ${{ matrix.project }}

  # The azure-login action's checks, from this branch (./actions): missing values and IDs
  # that aren't GUIDs must fail before azure/login runs. A real sign-in needs an Azure
  # identity, so it's not tested here.
  azure-login-checks:
    name: azure-login (checks, ${{ matrix.case }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: missing values
            client: ''
            tenant: ''
            subscription: ''
          - case: not a GUID
            client: my-identity
            tenant: 00000000-0000-0000-0000-000000000000
            subscription: 00000000-0000-0000-0000-000000000000
          - case: no id-token permission
            client: 00000000-0000-0000-0000-000000000000
            tenant: 00000000-0000-0000-0000-000000000000
            subscription: 00000000-0000-0000-0000-000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run azure-login
        id: login
        continue-on-error: true
        uses: ./actions/azure-login
        with:
          client-id: ${{ matrix.client }}
          tenant-id: ${{ matrix.tenant }}
          subscription-id: ${{ matrix.subscription }}

      - name: Expect a failure
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          if [ "${OUTCOME}" != failure ]; then
            echo "::error::azure-login should have failed its checks (outcome: ${OUTCOME})."
            exit 1
          fi
          echo "Failed as expected."

  # Smoke test of call mode: packages tests/fixtures/dotnet-web (dotnet publish) and
  # tests/fixtures/node-web (npm, build, production-only reinstall), plus the repo root,
  # which has neither and must skip with a warning. PRs only build: the deploy job is skipped.
  azure-webapp-deploy:
    name: Web App (smoke test, ${{ matrix.project }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/fixtures/dotnet-web
          - tests/fixtures/node-web
          - .
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/azure-webapp-deploy.yml
    with:
      working_directory: ${{ matrix.project }}

  # Smoke test of call mode: resolves the image derived from docker-build-push's values
  # (ghcr.io/<repo>:sha-<commit>) and an explicit image by digest. PRs never deploy, so the
  # deploy job is skipped; the check job compares the resolved references.
  azure-container-apps-deploy-derived:
    name: Container App (smoke test, derived image)
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
    uses: ./.github/workflows/azure-container-apps-deploy.yml
    with:
      app_name: my-api

  azure-container-apps-deploy-explicit:
    name: Container App (smoke test, explicit image)
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
    uses: ./.github/workflows/azure-container-apps-deploy.yml
    with:
      image: myregistry.azurecr.io/my-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      app_name: my-api

  azure-container-apps-deploy-outputs:
    name: Container App (smoke test, check outputs)
    needs: [azure-container-apps-deploy-derived, azure-container-apps-deploy-explicit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the resolved images
        env:
          DERIVED: ${{ needs.azure-container-apps-deploy-derived.outputs.image }}
          EXPLICIT: ${{ needs.azure-container-apps-deploy-explicit.outputs.image }}
          REVISION: ${{ needs.azure-container-apps-deploy-derived.outputs.revision }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          want="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA:0:7}"
          echo "derived=${DERIVED} explicit=${EXPLICIT} revision=${REVISION:-none}"
          [ "${DERIVED}" = "${want}" ] || { echo "::error::Derived image: expected ${want}, got '${DERIVED}'."; exit 1; }
          [ "${EXPLICIT}" = "myregistry.azurecr.io/my-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" ] \
            || { echo "::error::Explicit image changed: '${EXPLICIT}'."; exit 1; }
          [ -z "${REVISION}" ] || { echo "::error::A pull request must not deploy (revision '${REVISION}')."; exit 1; }

  # Smoke test of call mode: detects the project type of the repo root (simple),
  # tests/fixtures/node-npm (node) and tests/fixtures/dotnet (dotnet). PRs never release, so
  # the release job is skipped; the check job compares the detected types. The nested job
  # asks for write permissions, so the calling jobs must grant them.
  release-root:
    name: Release (smoke test, .)
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/release.yml

  release-node:
    name: Release (smoke test, tests/fixtures/node-npm)
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/release.yml
    with:
      working_directory: tests/fixtures/node-npm

  release-dotnet:
    name: Release (smoke test, tests/fixtures/dotnet)
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/release.yml
    with:
      working_directory: tests/fixtures/dotnet

  release-outputs:
    name: Release (smoke test, check outputs)
    needs: [release-root, release-node, release-dotnet]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the detected types
        env:
          ROOT: ${{ needs.release-root.outputs.release_type }}
          NODE: ${{ needs.release-node.outputs.release_type }}
          DOTNET: ${{ needs.release-dotnet.outputs.release_type }}
          CREATED: ${{ needs.release-root.outputs.release_created }}${{ needs.release-node.outputs.release_created }}${{ needs.release-dotnet.outputs.release_created }}
        run: |
          echo "root=${ROOT} node=${NODE} dotnet=${DOTNET}"
          [ "${ROOT}/${NODE}/${DOTNET}" = simple/node/dotnet ] || { echo "::error::Expected simple/node/dotnet."; exit 1; }
          [ -z "${CREATED}" ] || { echo "::error::A pull request must not release."; exit 1; }

  # Smoke test of call mode: a dry run of tests/fixtures/npm-package (a scoped package, never
  # published) to GitHub Packages, with the tag check; plus the repo root (no package.json)
  # and a private package, which both skip. The npmjs dry run (trusted publishing path) is
  # npm-publish-npmjs-outputs below: two calls with the same package, registry and tag
  # share a concurrency group, and GitHub cancels the one left waiting.
  # The nested job asks for id-token and packages, so the calling jobs must grant them.
  npm-publish:
    name: npm publish (smoke test, ${{ matrix.case.name }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: github, dir: tests/fixtures/npm-package, registry: github }
          - { name: root, dir: '.', registry: npmjs }
          - { name: private, dir: tests/fixtures/node-npm, registry: npmjs }
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      working_directory: ${{ matrix.case.dir }}
      registry: ${{ matrix.case.registry }}
      tag: v1.0.0
      dry_run: true

  npm-publish-outputs:
    name: npm publish (smoke test, check outputs)
    needs: npm-publish-npmjs-outputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the outputs
        env:
          NAME: ${{ needs.npm-publish-npmjs-outputs.outputs.name }}
          VERSION: ${{ needs.npm-publish-npmjs-outputs.outputs.version }}
          DIST_TAG: ${{ needs.npm-publish-npmjs-outputs.outputs.dist_tag }}
          PUBLISHED: ${{ needs.npm-publish-npmjs-outputs.outputs.published }}
        run: |
          echo "name=${NAME} version=${VERSION} dist_tag=${DIST_TAG} published=${PUBLISHED}"
          [ "${NAME}@${VERSION}" = "@rubone/shared-workflows-npm-fixture@1.0.0" ] || { echo "::error::Unexpected package."; exit 1; }
          [ "${DIST_TAG}" = latest ] || { echo "::error::Expected dist-tag latest."; exit 1; }
          [ "${PUBLISHED}" = false ] || { echo "::error::A dry run must not publish."; exit 1; }

  # Outputs of a matrix call are ambiguous, so one more plain call feeds the check above.
  npm-publish-npmjs-outputs:
    name: npm publish (smoke test, outputs)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      working_directory: tests/fixtures/npm-package
      tag: v1.0.0
      dry_run: true
