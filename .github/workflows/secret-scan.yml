# Secret scan: fails when commits contain secrets (API keys, tokens, private keys,
# connection strings...). Uses the gitleaks CLI (MIT, no license key needed, works in
# any org and in private repos without GitHub Advanced Security).
#
# What it scans:
#   - pull_request       -> only the PR's commits (base..head)
#   - push to main       -> only the pushed commits (before..after)
#   - workflow_dispatch  -> the whole git history (run it once when adopting it)
#
# Two ways to use this same file:
#
#   A) COPY (works in any repo, any org)
#      1. Copy this file as-is to .github/workflows/ in the target repo.
#      2. Edit the values under `env:` below if the defaults don't fit.
#      The pull_request / push / workflow_dispatch triggers run it; `workflow_call` is ignored.
#
#   B) CALL (any repo, any org: rubone/shared-workflows is public)
#      jobs:
#        secret-scan:
#          permissions: { contents: read }
#          uses: rubone/shared-workflows/.github/workflows/secret-scan.yml@v1
#      Inputs override the `env:` values below; the caller defines the trigger.
#
# False positives: add the finding's fingerprint (shown in the job summary) to a
# `.gitleaksignore` file at the repo root, or a `.gitleaks.toml` with custom rules.
# Full docs: https://github.com/rubone/shared-workflows/blob/main/docs/secret-scan.md
name: Secret scan

on:
  # A) Copy mode triggers.
  pull_request:
    branches:
      - main   # change if the repo's default branch isn't main
  push:
    branches:
      - main
  workflow_dispatch:   # manual run = full-history scan
  # B) Call mode: reusable workflow.
  workflow_call:
    inputs:
      full_history:
        description: "true = scan the whole git history instead of only the new commits."
        type: boolean
        required: false
        default: false
      warn_only:
        description: "true = report leaks but never fail. false falls back to env.WARN_ONLY."
        type: boolean
        required: false
        default: false

permissions: {}

# >>> Edit these when copying the file (copy mode). In call mode, inputs take precedence.
env:
  # 'true' = report leaks as warnings, never fail (useful while cleaning up an old repo).
  WARN_ONLY: 'false'

  # Tool version, pinned with its checksum. To update, change both together; the
  # checksum is in gitleaks_<version>_checksums.txt on the release page (linux_x64).
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # gitleaks reads commits, not just the working tree
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Pick commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_history }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # gitleaks exits 0 ("no leaks") when a revision doesn't exist, so check first.
          has_commit() { git cat-file -e "${1}^{commit}" 2>/dev/null; }
          full() {
            echo "::notice::Scanning the whole git history ($1)."
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "label=whole history" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${FULL_HISTORY}" = "true" ] && full "full_history input"

          case "${EVENT}" in
            pull_request|pull_request_target)
              for sha in "${PR_BASE}" "${PR_HEAD}"; do
                if ! has_commit "${sha}"; then
                  echo "::error::Commit ${sha} not found in the checkout; can't scan the PR."
                  exit 1
                fi
              done
              base="${PR_BASE}"; head="${PR_HEAD}" ;;
            push)
              # New branch (before = 000...) or force push (old tip not fetched).
              if [ -z "${PUSH_BEFORE}" ] || ! has_commit "${PUSH_BEFORE}"; then
                full "push without a previous commit to compare"
              fi
              base="${PUSH_BEFORE}"; head="${PUSH_AFTER}" ;;
            *)
              full "${EVENT} event" ;;
          esac

          count=$(git rev-list --count "${base}..${head}")
          echo "Scanning ${count} commit(s): ${base:0:7}..${head:0:7}"
          echo "log_opts=${base}..${head}" >> "$GITHUB_OUTPUT"
          echo "label=${count} commit(s), ${base:0:7}..${head:0:7}" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          LABEL: ${{ steps.range.outputs.label }}
          WARN_ONLY: ${{ inputs.warn_only || env.WARN_ONLY }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks.json"

          # --redact keeps secret values out of logs and the report.
          # --exit-code 2 tells "leaks found" (2) apart from tool errors (1).
          args=(git . --redact --no-banner --exit-code 2
                --report-format json --report-path "${report}")
          [ -n "${LOG_OPTS}" ] && args+=(--log-opts="${LOG_OPTS}")

          set +e
          "${RUNNER_TEMP}/gitleaks" "${args[@]}"
          code=$?
          set -e

          case "${code}" in
            0)
              echo "### ✅ Secret scan: no leaks found" >> "$GITHUB_STEP_SUMMARY"
              echo "Scanned: ${LABEL}." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            2) ;;
            *)
              echo "::error::gitleaks failed (exit code ${code}); see the log above."
              exit 1 ;;
          esac

          level=error
          [ "${WARN_ONLY}" = "true" ] && level=warning
          total=$(jq 'length' "${report}")

          # One annotation per finding, on the file and line (values escaped for
          # workflow commands).
          jq -r --arg level "${level}" '
            def prop: tostring | gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A")
                      | gsub(":";"%3A") | gsub(",";"%2C");
            def msg:  tostring | gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");
            .[] | "::\($level) file=\(.File | prop),line=\(.StartLine),title=\("Secret detected: " + .RuleID | prop)::\("Commit " + .Commit[0:7] + ". " + .Description | msg)"
          ' "${report}"

          {
            echo "### 🔑 Secret scan: ${total} possible secret(s) found"
            echo "Scanned: ${LABEL}."
            echo
            echo "| Rule | File | Commit | Fingerprint |"
            echo "|------|------|--------|-------------|"
            jq -r --arg url "${SERVER}/${REPO}/commit/" '
              def cell: tostring | gsub("\\|";"\\|") | gsub("\n";" ");
              .[] | "| \(.RuleID | cell) | `\(.File | cell)`:\(.StartLine) | [\(.Commit[0:7])](\($url + .Commit)) | `\(.Fingerprint | sub("^[0-9a-f]+:"; "") | cell)` |"
            ' "${report}"
            echo
            echo "**What to do:** a secret pushed to git must be treated as leaked, even if a"
            echo "later commit removes it. Revoke or rotate it first, then remove it from the code."
            echo "If it's a false positive, add its fingerprint as a line in \`.gitleaksignore\`"
            echo "at the repo root (this form, without the commit, also covers squash merges)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${level}" = "warning" ]; then
            echo "::warning::${total} possible secret(s) found (warn_only: not failing)."
            exit 0
          fi
          echo "::error::${total} possible secret(s) found. See the job summary."
          exit 1
